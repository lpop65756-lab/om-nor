*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:#090c11;color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
#app{min-height:100vh;position:relative;background:#050b14}#app::before,#app::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--mary) center/cover no-repeat}#app::before{filter:blur(28px) brightness(.55);transform:scale(1.15)}#app::after{background-size:contain;image-rendering:auto}#app>*{position:relative;z-index:1}
.topbar{height:74px;background:rgba(6,22,40,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:20;backdrop-filter:blur(18px)}
.brand-mini{font-weight:800;font-size:18px;white-space:nowrap}.brand-mini i{color:#5da5ff;margin-left:8px}.search{flex:1;max-width:620px;margin:auto;position:relative}.search i{position:absolute;right:16px;top:14px;color:#7890ab}.search input{width:100%;background:#102843;border:1px solid #2a4562;border-radius:14px;color:white;padding:11px 44px 11px 16px;outline:none}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2785ff,#6ea9ff);font-size:18px}.userbox small{color:var(--muted);display:block}.userbox strong{font-size:13px}.bell{position:relative;font-size:20px;color:#e9f3ff}.bell b{position:absolute;top:-9px;right:-9px;background:var(--red);border-radius:20px;font-size:10px;padding:2px 6px}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 74px)}.sidebar{background:rgba(4,20,37,.6);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:74px;height:calc(100vh - 74px);overflow:auto}.logo{padding:12px;text-align:center;margin-bottom:12px}.logo .motor{font-size:42px;color:#62a9ff;text-shadow:0 0 30px rgba(40,135,255,.5)}.logo h1{margin:2px 0;font-size:25px}.logo p{margin:0;color:#8fa5bd;font-size:11px}.nav-title{color:#627d99;font-size:11px;margin:18px 10px 7px}.nav button{width:100%;display:flex;align-items:center;gap:13px;color:#d8e6f6;background:transparent;padding:12px 13px;border-radius:12px;text-align:right;margin:4px 0;transition:.2s}.nav button i{width:22px;text-align:center;color:#9eb8d4}.nav button:hover{background:#112b49}.nav button.active{background:linear-gradient(90deg,#116cf0,#1d88ff);box-shadow:0 10px 24px rgba(22,119,255,.24)}.nav button.active i{color:white}.logout{margin-top:20px;background:#241725!important;color:#ff9aa7!important}
main{padding:22px;min-width:0}.hero{min-height:175px;border:1px solid #315273;border-radius:20px;overflow:hidden;position:relative;background:rgba(8,25,46,.55);display:flex;align-items:center;padding:28px 32px;box-shadow:var(--shadow)}.hero h2{font-size:27px;margin:0 0 5px}.hero p{color:#b4c7dc;margin:0}.hero .hero-badge{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap}.pill{padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#dcecff}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.stat{padding:18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(20,48,78,.95),rgba(9,28,49,.96));box-shadow:var(--shadow);position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--glow);filter:blur(35px);left:-20px;bottom:-35px;opacity:.35}.stat .ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:20px;background:var(--ico);margin-bottom:12px}.stat .label{color:#a9bfd7;font-size:12px}.stat .num{font-size:26px;font-weight:800;margin-top:3px}.stat .sub{font-size:11px;color:#7891aa;margin-top:4px}.blue{--ico:rgba(34,125,255,.2);--glow:#1677ff}.green{--ico:rgba(22,199,132,.2);--glow:#16c784}.orange{--ico:rgba(255,173,47,.2);--glow:#ffad2f}.purple{--ico:rgba(139,92,246,.2);--glow:#8b5cf6}
.a-red{background:linear-gradient(135deg,#b3263d,#e5484d)}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:15px}.action{padding:13px 15px;border-radius:14px;color:white;display:flex;align-items:center;gap:12px;text-align:right;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:.2s}.action:hover{transform:translateY(-2px)}.action i{font-size:19px}.a-green{background:linear-gradient(135deg,#0d9f69,#16c784)}.a-blue{background:linear-gradient(135deg,#1467db,#2b8cff)}.a-purple{background:linear-gradient(135deg,#6843ca,#925fff)}.a-orange{background:linear-gradient(135deg,#d77d00,#f5a623)}
.content-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-top:15px}.card{background:rgba(8,29,50,.72);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(48,77,105,.55)}.card-head h3{margin:0;font-size:15px}.card-head a{color:#65a9ff;font-size:12px;cursor:pointer}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px 13px;border-bottom:1px solid rgba(47,74,99,.45);white-space:nowrap}.table th{color:#8ea7c0;font-weight:600;background:rgba(255,255,255,.025)}.empty{padding:35px;text-align:center;color:#7890a8}.empty i{font-size:32px;display:block;margin-bottom:8px;color:#3e668b}.tag{padding:4px 8px;border-radius:8px;font-size:10px}.tag.green{background:rgba(22,199,132,.14);color:#49dda5}.tag.red{background:rgba(255,77,99,.14);color:#ff8191}.tag.orange{background:rgba(255,173,47,.14);color:#ffc15c}

.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#12365b 0,#071426 42%,#030b14 100%);padding:20px}.login-box{width:min(460px,100%);background:rgba(8,27,47,.92);border:1px solid #315272;border-radius:24px;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center}.login-logo{font-size:50px;color:#57a3ff}.login-box h1{margin:6px 0;font-size:25px}.login-box p{color:#91a8c0;font-size:12px}.login-box .form{margin-top:20px;text-align:right;grid-template-columns:1fr}.login-box button{width:100%;margin-top:15px}.setup-note{background:#0d2944;border:1px solid #274b6b;padding:10px;border-radius:11px;color:#a9c2da;font-size:11px;margin-top:13px}

0px;margin-bottom:8px}.lg-box .primary{width:100%;padding:14px;font-size:16px}

<body>
<div id="app">
<header class="topbar"><button class="menu-btn" onclick="toggleSide()"><i class="fa-solid fa-bars"></i></button><div class="brand-mini"><i class="fa-solid fa-motorcycle"></i> أم النور</div><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="globalSearch" placeholder="ابحث عن منتج أو فاتورة أو عميل..." oninput="globalSearch()"></div><button id="tgBtn" class="tgbtn" onclick="goTg()" title="ربط تليجرام (نسخ احتياطي وإشعارات)"><i class="fa-brands fa-telegram"></i><span>اربط تليجرام</span></button><div class="bell"><i class="fa-regular fa-bell"></i><b id="bellCount">0</b></div><div class="userbox"><div class="avatar"><i class="fa-solid fa-user"></i></div><div><strong>مدير النظام</strong></div></div></header>
<div class="layout"><aside id="sidebar" class="sidebar"><div class="logo"><div class="motor"><i class="fa-solid fa-motorcycle"></i></div><h1>أم النور</h1><p>قطع غيار ومستلزمات الموتوسيكلات</p></div><nav class="nav">
<div class="nav-title">الرئيسية</div><button class="active" data-page="dashboard" onclick="showPage('dashboard',this)"><i class="fa-solid fa-house"></i><span>الرئيسية</span></button>
<button class="tgnav" onclick="goTg()"><i class="fa-brands fa-telegram"></i><span>ربط تليجرام</span></button><div class="nav-title">الإدارة</div><button data-page="inventory" onclick="showPage('inventory',this)"><i class="fa-solid fa-boxes-stacked"></i><span>المخزون</span></button><button data-page="sales" onclick="showPage('sales',this)"><i class="fa-solid fa-cart-shopping"></i><span>المبيعات</span></button><button data-page="purchases" onclick="showPage('purchases',this)"><i class="fa-solid fa-truck-ramp-box"></i><span>المشتريات</span></button><button data-page="returns" onclick="showPage('returns',this)"><i class="fa-solid fa-rotate-left"></i><span>مرتجعات البيع</span></button><button data-page="purchaseReturns" onclick="showPage('purchaseReturns',this)"><i class="fa-solid fa-arrow-rotate-right"></i><span>مرتجعات الشراء</span></button><button data-page="invoices" onclick="showPage('invoices',this)"><i class="fa-solid fa-file-invoice"></i><span>الفواتير</span></button>
<div class="nav-title">الأطراف</div><button data-page="customers" onclick="showPage('customers',this)"><i class="fa-solid fa-users"></i><span>العملاء</span></button><button data-page="suppliers" onclick="showPage('suppliers',this)"><i class="fa-solid fa-truck"></i><span>الموردين</span></button><button data-page="debts" onclick="showPage('debts',this)"><i class="fa-solid fa-money-bill-transfer"></i><span>الآجل / الديون</span></button>
<div class="nav-title">الورشة والخزنة</div><button data-page="jobs" onclick="showPage('jobs',this)"><i class="fa-solid fa-screwdriver-wrench"></i><span>الصيانة</span></button><button data-page="cash" onclick="showPage('cash',this)"><i class="fa-solid fa-vault"></i><span>الخزنة والمصروفات</span></button><div class="nav-title">التقارير</div><button data-page="reports" onclick="showPage('reports',this)"><i class="fa-solid fa-chart-column"></i><span>التقارير</span></button><button data-page="settings" onclick="showPage('settings',this)"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></button><button class="logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i><span>تسجيل الخروج</span></button>
</nav></aside><main id="main"></main></div></div>
<div id="modalBg" class="modal-bg hidden" onclick="closeModal(event)"><div id="modal" class="modal" onclick="event.stopPropagation()"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='am_elnoor_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null');
const blank=()=>({products:[],customers:[],suppliers:[],invoices:[],returns:[],purchaseReturns:[],payments:[],adjustments:[],account:null});
if(!db) db=blank();
db.payments=db.payments||[];db.adjustments=db.adjustments||[];db.returns=db.returns||[];db.purchaseReturns=db.purchaseReturns||[];
(function(){const ymdL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');db.invoices.forEach(x=>{if(x.paid===undefined){x.paid=x.payment==='آجل'?0:x.total;if(x.payment==='آجل'&&!x.due){const d=new Date(x.date);d.setDate(d.getDate()+14);x.due=ymdL(d)}}})})();
function money(n){return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:0,maximumFractionDigits:2})+' ج.م'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(p='ID'){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2500)}
function init(){showPage('dashboard',document.querySelector('[data-page=dashboard]'));updateBell()}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function showPage(page,btn){curPage=page;document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b===btn));document.getElementById('sidebar').classList.remove('open');const m=document.getElementById('main');({dashboard:renderDashboard,inventory:renderInventory,sales:()=>renderInvoices('sales'),purchases:()=>renderInvoices('purchase'),returns:()=>renderInvoices('return'),purchaseReturns:()=>renderInvoices('purchaseReturn'),invoices:()=>renderInvoices('all'),customers:renderCustomers,suppliers:renderSuppliers,debts:renderDebts,reports:renderReports,settings:renderSettings,jobs:renderJobs,cash:renderCash}[page]||renderDashboard)(m)}
function renderDashboard(m){const sales=db.invoices.filter(x=>x.type==='sales'&&!x.opening),purchases=db.invoices.filter(x=>x.type==='purchase'&&!x.opening),totalSales=sales.reduce((a,x)=>a+x.total,0)-db.returns.reduce((a,x)=>a+x.total,0),totalPurch=purchases.reduce((a,x)=>a+x.total,0),debt=db.invoices.filter(x=>x.type==='sales'&&x.payment==='آجل').reduce((a,x)=>a+remain(x),0),low=db.products.filter(p=>p.qty<=p.min);m.innerHTML=tgBanner()+`<section class="hero"><div><h2>صباح الخير 👋</h2><p>مرحبًا بك في نظام إدارة ورشة ومعرض أم النور — كل أرقام الصفحة مبنية على بياناتك الفعلية.</p></div><div class="hero-badge"><span class="pill"><i class="fa-regular fa-calendar"></i> ${new Date().toLocaleDateString('ar-EG')}</span><span class="pill"><i class="fa-solid fa-database"></i> بيانات محلية</span></div></section>${todayPanel()}<div class="grid4"><div class="stat blue"><div class="ico"><i class="fa-solid fa-cart-shopping"></i></div><div class="label">إجمالي المبيعات</div><div class="num">${money(totalSales)}</div><div class="sub">${sales.length} فاتورة بيع</div></div><div class="stat green"><div class="ico"><i class="fa-solid fa-box"></i></div><div class="label">إجمالي المنتجات</div><div class="num">${db.products.length}</div><div class="sub">${db.products.reduce((a,p)=>a+Number(p.qty),0)} قطعة في المخزن</div></div><div class="stat orange"><div class="ico"><i class="fa-solid fa-money-bill-wave"></i></div><div class="label">الآجل / الديون</div><div class="num">${money(debt)}</div><div class="sub">من فواتير البيع الآجل</div></div><div class="stat purple"><div class="ico"><i class="fa-solid fa-users"></i></div><div class="label">إجمالي العملاء</div><div class="num">${db.customers.length}</div><div class="sub">عملاء مسجلون</div></div></div><div class="actions"><button class="action a-green" onclick="openSale()"><i class="fa-solid fa-cart-plus"></i><div><b>فاتورة بيع جديدة</b><small>تحديث المخزون تلقائيًا</small></div></button><button class="action a-blue" onclick="openPurchase()"><i class="fa-solid fa-truck-ramp-box"></i><div><b>فاتورة شراء جديدة</b><small>إضافة الكميات للمخزون</small></div></button><button class="action a-red" onclick="openReturn()"><i class="fa-solid fa-rotate-left"></i><div><b>مرتجع بيع</b><small>الزبون رجّع حاجة</small></div></button><button class="action a-purple" onclick="openProduct()"><i class="fa-solid fa-box-open"></i><div><b>إضافة منتج</b><small>تسجيل صنف جديد</small></div></button><button class="action a-orange" onclick="openCustomer()"><i class="fa-solid fa-user-plus"></i><div><b>إضافة عميل</b><small>تسجيل عميل جديد</small></div></button></div><div class="content-grid"><div class="card"><div class="card-head"><h3><i class="fa-solid fa-chart-line"></i> حركة المبيعات والمشتريات</h3><div class="legend"><span>المبيعات</span><span class="lg2">المشتريات</span></div></div>${chartHTML(sales,purchases)}</div><div class="card"><div class="card-head"><h3><i class="fa-solid fa-triangle-exclamation"></i> تنبيهات المخزون</h3><a onclick="showPage('inventory',document.querySelector('[data-page=inventory]'))">عرض الكل</a></div>${low.length?`<div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>الكمية</th><th>الحد الأدنى</th><th>الحالة</th></tr></thead><tbody>${low.slice(0,7).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>${p.min}</td><td><span class="tag ${p.qty===0?'red':'orange'}">${p.qty===0?'نفد المخزون':'منخفض'}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><i class="fa-solid fa-circle-check"></i>لا توجد تنبيهات. أضف منتجاتك وسيظهر التنبيه عند انخفاض الكمية.</div>`}</div></div><div class="content-grid"><div class="card"><div class="card-head"><h3><i class="fa-solid fa-file-invoice"></i> آخر الفواتير</h3><a onclick="showPage('invoices',document.querySelector('[data-page=invoices]'))">عرض الكل</a></div>${invoiceTable(db.invoices.slice().reverse().slice(0,7))}</div><div class="card"><div class="card-head"><h3><i class="fa-solid fa-clock"></i> مواعيد السداد القادمة</h3><a onclick="showPage(\'debts\',document.querySelector(\'[data-page=debts]\'))">عرض الكل</a></div>${dueSoonHTML()}</div></div>`}
function chartHTML(sales,purchases){const days=[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return d});const vals=days.map(d=>{const k=d.toISOString().slice(0,10);return [sales.filter(x=>x.date.slice(0,10)===k).reduce((a,x)=>a+x.total,0),purchases.filter(x=>x.date.slice(0,10)===k).reduce((a,x)=>a+x.total,0),d.toLocaleDateString('ar-EG',{weekday:'short'})]});const max=Math.max(1,...vals.flatMap(x=>[x[0],x[1]]));return `<div class="chart"><div class="bars">${vals.map(v=>`<div class="barcol"><div class="bar sales" style="height:${Math.max(4,v[0]/max*90)}%"></div><div class="bar buy" style="height:${Math.max(4,v[1]/max*90)}%"></div><span class="barlabel">${v[2]}</span></div>`).join('')}</div></div>`}
function pageShell(title,sub,btn,body){return `<div class="page-title"><div><h2>${title}</h2><p>${sub}</p></div>${btn||''}</div>${body}`}
function renderInventory(m){m.innerHTML=pageShell('المخزون','كل ما يظهر هنا هو ما تقوم بإضافته بنفسك. لا توجد أصناف وهمية.',`<button class="primary" onclick="openProduct()"><i class="fa-solid fa-plus"></i> إضافة منتج</button>`,`<div class="toolbar"><input id="invSearch" placeholder="ابحث بالاسم أو الكود أو الفئة..." oninput="filterInventory()"><select id="invFilter" onchange="filterInventory()"><option value="all">كل الحالات</option><option value="ok">متوفر</option><option value="low">منخفض</option><option value="out">نفد</option></select></div><div class="card"><div id="inventoryTable">${inventoryTable(db.products)}</div></div>`)}
function inventoryTable(ps){if(!ps.length)return `<div class="empty"><i class="fa-solid fa-box-open"></i>لا توجد منتجات حتى الآن. اضغط «إضافة منتج» وسجل أصنافك.</div>`;return `<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>المنتج</th><th>الكود</th><th>الفئة</th><th>الكمية</th><th>الحد الأدنى</th><th>شراء</th><th>بيع</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${ps.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.code||'-')}</td><td>${esc(p.cat||'-')}</td><td>${p.qty}</td><td>${p.min}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td><span class="tag ${p.qty===0?'red':p.qty<=p.min?'orange':'green'}">${p.qty===0?'نفد':p.qty<=p.min?'منخفض':'متوفر'}</span></td><td><button class="secondary" onclick="editProduct('${p.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button> <button class="secondary" onclick="openAdjust('${p.id}')" title="نقص / زيادة"><i class="fa-solid fa-sliders"></i></button> <button class="danger" onclick="deleteProduct('${p.id}')"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`}
function filterInventory(){const q=document.getElementById('invSearch').value.toLowerCase(),f=document.getElementById('invFilter').value;let ps=db.products.filter(p=>(`${p.name} ${p.code} ${p.cat}`).toLowerCase().includes(q));if(f==='ok')ps=ps.filter(p=>p.qty>p.min);if(f==='low')ps=ps.filter(p=>p.qty>0&&p.qty<=p.min);if(f==='out')ps=ps.filter(p=>p.qty===0);document.getElementById('inventoryTable').innerHTML=inventoryTable(ps)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.remove('hidden')};function closeModal(e){if(e.target.id==='modalBg')document.getElementById('modalBg').classList.add('hidden')};function closeM(){document.getElementById('modalBg').classList.add('hidden')}
function openProduct(id){const p=db.products.find(x=>x.id===id);openModal(`<h3>${p?'تعديل المنتج':'إضافة منتج جديد'}</h3><div class="form"><label><span>اسم المنتج *</span><input id="pName" value="${esc(p?.name||'')}"></label><label><span>الكود</span><input id="pCode" value="${esc(p?.code||'')}"></label><label><span>الفئة</span><input id="pCat" value="${esc(p?.cat||'')}"></label><label><span>الكمية الحالية *</span><input id="pQty" type="number" min="0" value="${p?.qty??0}"></label><label><span>الحد الأدنى</span><input id="pMin" type="number" min="0" value="${p?.min??5}"></label><label><span>سعر الشراء</span><input id="pBuy" type="number" min="0" step="0.01" value="${p?.buy??0}"></label><label><span>سعر البيع</span><input id="pSell" type="number" min="0" step="0.01" value="${p?.sell??0}"></label></div><div class="modal-actions"><button class="primary" onclick="saveProduct('${p?.id||''}')">حفظ المنتج</button><button class="secondary" onclick="closeM()">إلغاء</button></div>`)}
function saveProduct(id){const data={name:document.getElementById('pName').value.trim(),code:document.getElementById('pCode').value.trim(),cat:document.getElementById('pCat').value.trim(),qty:+document.getElementById('pQty').value,min:+document.getElementById('pMin').value,buy:+document.getElementById('pBuy').value,sell:+document.getElementById('pSell').value};if(!data.name){toast('اسم المنتج مطلوب');return}if(id)Object.assign(db.products.find(x=>x.id===id),data);else db.products.push({id:uid('P'),...data});save();closeM();renderInventory(document.getElementById('main'));toast('تم حفظ المنتج')}
function editProduct(id){openProduct(id)}async function deleteProduct(id){if(await askConfirm('هل تريد حذف المنتج؟')){db.products=db.products.filter(x=>x.id!==id);save();renderInventory(document.getElementById('main'));toast('تم حذف المنتج')}}
function openSale(){invoiceModal('sales')}function openPurchase(){invoiceModal('purchase')}
function openReturn(){openReturnModal('return')}function openPurchaseReturn(){openReturnModal('purchaseReturn')}

function globalSearch(){const q=document.getElementById('globalSearch').value.trim().toLowerCase();if(!q)return;const found=db.products.find(p=>`${p.name} ${p.code}`.toLowerCase().includes(q));if(found){showPage('inventory',document.querySelector('[data-page=inventory]'));setTimeout(()=>{document.getElementById('invSearch').value=q;filterInventory()},0)}}
/* ===== نظام الفواتير متعددة الأصناف + الآجل ===== */
const r2=n=>Math.round((+n||0)*100)/100;
const ymd=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const today=()=>ymd(new Date());
const inDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const remain=x=>Math.max(0,r2((x.total||0)-(x.paid||0)));
const daysLeft=due=>Math.round((new Date(due+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const typeName={sales:'بيع',purchase:'شراء',return:'مرتجع بيع',purchaseReturn:'مرتجع شراء'};
const outgoing=t=>t==='sales'||t==='purchaseReturn';
const pageOf={sales:'sales',purchase:'purchases',return:'returns',purchaseReturn:'purchaseReturns'};
let curPage='dashboard';
function refresh(){showPage(curPage,document.querySelector('[data-page='+curPage+']'))}
function findDoc(id){return db.invoices.find(x=>x.id===id)||db.returns.find(x=>x.id===id)||db.purchaseReturns.find(x=>x.id===id)}
function overdueList(){return db.invoices.filter(x=>x.type==='sales'&&x.payment==='آجل'&&remain(x)>0&&x.due&&daysLeft(x.due)<0)}
function updateBell(){const low=db.products.filter(p=>p.qty<=p.min).length;document.getElementById('bellCount').textContent=low+overdueList().length}
function dueInfo(x){const r=remain(x);if(r<=0)return{t:'مسدد',c:'green',s:'تم السداد'};if(!x.due)return{t:'مفتوح',c:'orange',s:'بدون ميعاد'};const d=daysLeft(x.due);if(d<0)return{t:'متأخر',c:'red',s:'متأخر '+(-d)+' يوم'};if(d===0)return{t:'مستحق اليوم',c:'red',s:'اليوم'};return{t:d<=7?'قريب':'مفتوح',c:'orange',s:'بعد '+d+' يوم'}}
function fmtDate(s){return s?new Date(s+(s.length===10?'T00:00:00':'')).toLocaleDateString('ar-EG'):'-'}
function applyToDebt(kind,party,amount,note,ref,first){let left=r2(amount);const list=db.invoices.filter(x=>x.type===kind&&x.payment==='آجل'&&x.party===party&&remain(x)>0).sort((a,b)=>(a.id===first?-1:b.id===first?1:0)||(a.date<b.date?-1:1));for(const inv of list){if(left<=0)break;const pay=Math.min(left,remain(inv));inv.paid=r2((inv.paid||0)+pay);left=r2(left-pay);db.payments.push({id:uid('PY'),date:new Date().toISOString(),invoiceId:inv.id,amount:pay,note,ref:ref||''})}return r2(amount-left)}

/* ---------- نافذة الفاتورة / المرتجع ---------- */
let cart=[],cartType='sales';
function invoiceModal(type){docModal(type)}
function openReturnModal(type){docModal(type)}
let retSrc=null;
function srcSelect(type){const kind=type==='return'?'sales':'purchase',a=db.invoices.filter(x=>x.type===kind).sort((x,y)=>x.date<y.date?1:-1).slice(0,150);
 return `<div class="addbox" style="margin:0 0 12px;border-style:solid;border-color:#2d6a4f"><label><span><b>الزبون رجّع حاجة اشتراها؟ اختار فاتورته وهتتحمّل أصنافها لوحدها</b></span><select id="srcInv" onchange="loadFromInvoice(this.value)"><option value="">— بدون فاتورة (أختار الأصناف بنفسي) —</option>${a.map(x=>`<option value="${x.id}">${esc(x.party||(kind==='sales'?'عميل نقدي':'مورد'))} · ${new Date(x.date).toLocaleDateString('ar-EG')} · ${money(x.total)} · ${(x.items||[]).map(i=>i.name).join('، ').slice(0,40)}</option>`).join('')}</select></label></div>`}
function returnedQty(invId,pid){return[...db.returns,...db.purchaseReturns].filter(r=>r.invoiceId===invId).reduce((a,r)=>a+r.items.filter(i=>i.productId===pid).reduce((s,i)=>s+i.qty,0),0)}
function returnFrom(id){const x=db.invoices.find(i=>i.id===id);if(!x)return;docModal(x.type==='sales'?'return':'purchaseReturn');document.getElementById('srcInv').value=id;loadFromInvoice(id)}
function setDue(n){document.getElementById('dueDate').value=inDays(n)}
function payChanged(){const credit=(cartType==='sales'||cartType==='purchase')&&document.getElementById('payment').value==='آجل';document.getElementById('paidWrap')?.classList.toggle('hidden',!credit);document.getElementById('dueWrap')?.classList.toggle('hidden',!credit);renderCart()}
function itemChanged(){const v=document.getElementById('item').value;document.getElementById('newProd')?.classList.toggle('hidden',v!=='__new');const p=db.products.find(x=>x.id===v);const sell=cartType==='sales'||cartType==='return';document.getElementById('itemPrice').value=p?(sell?p.sell:p.buy):''}
function cartSub(){return r2(cart.reduce((a,l)=>a+l.qty*l.price,0))}
function addLine(){
 const v=document.getElementById('item').value,q=+document.getElementById('itemQty').value,pr=document.getElementById('itemPrice').value,price=+pr;
 if(!(q>0)){toast('الكمية غير صحيحة');return}
 if(pr===''||!(price>=0)){toast('اكتب السعر');return}
 let line;
 if(v==='__new'){const name=document.getElementById('npName').value.trim();if(!name){toast('اكتب اسم المنتج الجديد');return}line={productId:null,isNew:true,name,code:document.getElementById('npCode').value.trim(),sell:+document.getElementById('npSell').value||price,qty:q,price}}
 else{const p=db.products.find(x=>x.id===v);if(!p){toast('اختر منتجًا أولًا');return}
  if(outgoing(cartType)){const inCart=cart.filter(l=>l.productId===p.id).reduce((a,l)=>a+l.qty,0);if(inCart+q>p.qty){toast('المتاح من «'+p.name+'» في المحل '+p.qty+' فقط');return}}
  line={productId:p.id,name:p.name,qty:q,price}}
 const same=line.productId&&cart.find(l=>l.productId===line.productId&&l.price===line.price);
 if(same)same.qty+=q;else cart.push(line);
 document.getElementById('itemQty').value=1;if(v==='__new'){['npName','npSell','npCode','itemPrice'].forEach(i=>document.getElementById(i).value='')}
 renderCart();
}
function setQty(i,v){v=+v;const l=cart[i];if(!(v>0)){renderCart();return}if(outgoing(cartType)&&l.productId){const p=db.products.find(x=>x.id===l.productId),other=cart.reduce((a,m,j)=>a+(j!==i&&m.productId===l.productId?m.qty:0),0);if(p&&other+v>p.qty){toast('المتاح '+p.qty+' فقط');renderCart();return}}l.qty=v;renderCart()}
function removeLine(i){cart.splice(i,1);renderCart()}
function calcTotals(){const t=cartType,hasDisc=t==='sales'||t==='purchase',sub=cartSub(),disc=hasDisc?Math.min(Math.max(+document.getElementById('discount').value||0,0),sub):0,total=r2(sub-disc),credit=hasDisc&&document.getElementById('payment').value==='آجل',paid=credit?Math.min(Math.max(+document.getElementById('paidNow').value||0,0),total):total;return{sub,disc,total,credit,paid,hasDisc}}
function renderCart(){
 const c=calcTotals();
 document.getElementById('cartBox').innerHTML=cart.length?`<div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody>${cart.map((l,i)=>`<tr><td>${esc(l.name)}${l.isNew?' <span class="tag orange">جديد</span>':''}</td><td><input type="number" min="1" value="${l.qty}" style="width:70px;background:#0b2138;border:1px solid #2a4662;color:#fff;border-radius:8px;padding:5px" onchange="setQty(${i},this.value)"></td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td><td><button class="danger" style="padding:6px 10px" onclick="removeLine(${i})"><i class="fa-solid fa-xmark"></i></button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty" style="padding:18px">لم تضف أي صنف بعد.</div>`;
 document.getElementById('totals').innerHTML=`<div class="totals">${c.hasDisc?`<div><span>قبل الخصم</span><b>${money(c.sub)}</b></div><div><span>الخصم</span><b>${money(c.disc)}</b></div>`:''}<div class="grand"><span>الإجمالي</span><b>${money(c.total)}</b></div>${c.credit?`<div><span>المدفوع الآن</span><b>${money(c.paid)}</b></div><div class="grand late"><span>المتبقي (آجل)</span><b>${money(r2(c.total-c.paid))}</b></div>`:''}</div>`;
}
function saveDoc(type){(type==='sales'||type==='purchase')?saveInvoice(type):saveReturnDoc(type)}
function ensureParty(isSale,name){if(!name)return;const list=isSale?db.customers:db.suppliers;if(!list.some(x=>x.name===name))list.push({id:uid(isSale?'C':'S'),name,phone:'',address:'',notes:''})}
function goAfter(type){showPage(pageOf[type],document.querySelector('[data-page='+pageOf[type]+']'))}

/* ---------- عرض / طباعة / إلغاء ---------- */
function docSubtotal(x){return r2((x.items||[]).reduce((a,i)=>a+i.qty*i.price,0))}
function printInvoice(id){
 const x=findDoc(id);if(!x)return;const sub=docSubtotal(x),disc=r2(sub-x.total),credit=x.payment==='آجل';
 const h=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(x.id)}</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:24px;color:#111}h2,h3{margin:0 0 6px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #999;padding:7px;text-align:right}th{background:#eee}.t{margin-top:14px;line-height:2}</style></head><body><h2>ورشة ومعرض أم النور</h2><h3>${typeName[x.type]} رقم ${esc(x.id)}</h3><div>التاريخ: ${new Date(x.date).toLocaleString('ar-EG')}</div><div>الاسم: ${esc(x.party||'نقدي')}</div><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${(x.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</table><div class="t">${disc>0?'الخصم: '+money(disc)+'<br>':''}<b>الإجمالي: ${money(x.total)}</b>${credit?'<br>المدفوع: '+money(x.paid)+'<br><b>المتبقي: '+money(remain(x))+'</b>'+(x.due?'<br>ميعاد السداد: '+fmtDate(x.due):''):''}</div></body></html>`;
 const w=window.open('','_blank');if(!w){toast('المتصفح منع نافذة الطباعة');return}w.document.write(h);w.document.close();w.focus();setTimeout(()=>w.print(),300);
}

/* ---------- جداول الفواتير ---------- */
function allDocs(){return[...db.invoices,...db.returns,...db.purchaseReturns]}
function docsOf(type){return type==='all'?allDocs():type==='return'?db.returns:type==='purchaseReturn'?db.purchaseReturns:db.invoices.filter(x=>x.type===type)}
function renderInvoices(type){const title={sales:'المبيعات',purchase:'المشتريات',return:'مرتجعات البيع',purchaseReturn:'مرتجعات الشراء',all:'الفواتير'}[type];
 document.getElementById('main').innerHTML=pageShell(title,'اضغط على أي فاتورة لعرض تفاصيلها أو طباعتها أو إلغائها.',`<div style="display:flex;gap:8px;flex-wrap:wrap">${type==='all'?`<button class="primary" onclick="openSale()">بيع جديد</button><button class="secondary" onclick="openPurchase()">شراء جديد</button>`:`<button class="primary" onclick="${type==='purchase'?'openPurchase()':type==='return'?'openReturn()':type==='purchaseReturn'?'openPurchaseReturn()':'openSale()'}"><i class="fa-solid fa-plus"></i> ${type==='return'||type==='purchaseReturn'?'مرتجع جديد':'فاتورة جديدة'}</button>`}</div>`,`<div class="toolbar"><input placeholder="بحث بالرقم أو الاسم..." oninput="filterInvoices(this,'${type}')"></div><div class="card" id="invoiceList">${invoiceTable(docsOf(type))}</div>`)}
function filterInvoices(input,type){const q=input.value.toLowerCase();document.getElementById('invoiceList').innerHTML=invoiceTable(docsOf(type).filter(x=>`${x.id} ${x.party} ${x.payment}`.toLowerCase().includes(q)))}

/* ---------- الآجل والديون ---------- */
let debtTab='sales',debtFilter='open',debtQ='';
function debtInvoices(){return db.invoices.filter(x=>x.type===debtTab&&x.payment==='آجل')}
function renderDebts(m){
 m=m||document.getElementById('main');const isC=debtTab==='sales',all=debtInvoices(),open=all.filter(x=>remain(x)>0);
 const total=r2(open.reduce((a,x)=>a+remain(x),0)),late=open.filter(x=>x.due&&daysLeft(x.due)<0),soon=open.filter(x=>x.due&&daysLeft(x.due)>=0&&daysLeft(x.due)<=7);
 const by={};open.forEach(x=>{const b=by[x.party]=by[x.party]||{name:x.party,rem:0,n:0,next:null};b.rem=r2(b.rem+remain(x));b.n++;if(x.due&&(!b.next||x.due<b.next))b.next=x.due});
 const parties=Object.values(by).sort((a,b)=>b.rem-a.rem);
 m.innerHTML=pageShell('الآجل والديون',isC?'الناس اللي أخدت فواتير آجل وهتسددها بعدين.':'الفواتير اللي اشتريتها آجل من الموردين.',`<div style="display:flex;gap:8px"><button class="${isC?'primary':'secondary'}" onclick="debtTab='sales';renderDebts()">ديون العملاء (ليّا)</button><button class="${isC?'secondary':'primary'}" onclick="debtTab='purchase';renderDebts()">ديون الموردين (عليّا)</button><button class="secondary" onclick="openOpening()">＋ دين قديم</button></div>`,
 `<div class="grid4"><div class="stat orange"><div class="ico"><i class="fa-solid fa-money-bill-transfer"></i></div><div class="label">إجمالي المتبقي</div><div class="num">${money(total)}</div><div class="sub">${open.length} فاتورة مفتوحة</div></div><div class="stat blue" style="--x:0"><div class="ico"><i class="fa-solid fa-users"></i></div><div class="label">${isC?'عملاء عليهم آجل':'موردين لهم آجل'}</div><div class="num">${parties.length}</div></div><div class="stat purple"><div class="ico"><i class="fa-solid fa-clock"></i></div><div class="label">مستحق خلال 7 أيام</div><div class="num">${money(r2(soon.reduce((a,x)=>a+remain(x),0)))}</div><div class="sub">${soon.length} فاتورة</div></div><div class="stat green" style="background:linear-gradient(145deg,rgba(90,25,40,.95),rgba(40,10,20,.96))"><div class="ico"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="label">متأخر عن الميعاد</div><div class="num">${money(r2(late.reduce((a,x)=>a+remain(x),0)))}</div><div class="sub">${late.length} فاتورة</div></div></div>
 ${parties.length?`<div class="card" style="margin-top:15px"><div class="card-head"><h3>${isC?'حساب كل عميل':'حساب كل مورد'}</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>عدد الفواتير</th><th>المتبقي</th><th>أقرب ميعاد</th><th></th></tr></thead><tbody>${parties.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${b.n}</td><td><b>${money(b.rem)}</b></td><td>${b.next?fmtDate(b.next):'-'}</td><td><button class="primary" style="padding:7px 12px" onclick="payParty('${encodeURIComponent(b.name)}')">تسديد</button> ${isC?waBtn(b.name,b.rem):''}</td></tr>`).join('')}</tbody></table></div></div>`:''}
 <div class="toolbar" style="margin-top:15px"><input placeholder="بحث بالاسم أو رقم الفاتورة..." value="${esc(debtQ)}" oninput="debtQ=this.value;refreshDebtList()"><select onchange="debtFilter=this.value;refreshDebtList()"><option value="open" ${debtFilter==='open'?'selected':''}>المفتوحة</option><option value="late" ${debtFilter==='late'?'selected':''}>المتأخرة</option><option value="paid" ${debtFilter==='paid'?'selected':''}>المسددة</option><option value="all" ${debtFilter==='all'?'selected':''}>الكل</option></select></div>
 <div class="card" id="debtList">${debtListHTML()}</div>`)}
function waBtn(name,rem){const c=db.customers.find(x=>x.name===name);if(!c||!c.phone)return '';let d=c.phone.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);const t=encodeURIComponent('مرحبًا '+name+'، تذكير بمبلغ '+money(rem)+' المتبقي لدى ورشة ومعرض أم النور. شكرًا لك.');return `<button class="secondary" style="padding:7px 12px" onclick="window.open('https://wa.me/${d}?text=${t}','_blank')"><i class="fa-brands fa-whatsapp"></i></button>`}
function debtListHTML(){let a=debtInvoices();const q=debtQ.toLowerCase();if(q)a=a.filter(x=>`${x.party} ${x.id}`.toLowerCase().includes(q));
 if(debtFilter==='open')a=a.filter(x=>remain(x)>0);else if(debtFilter==='late')a=a.filter(x=>remain(x)>0&&x.due&&daysLeft(x.due)<0);else if(debtFilter==='paid')a=a.filter(x=>remain(x)<=0);
 a.sort((x,y)=>(x.due||'9999')<(y.due||'9999')?-1:1);

function buildItems(type){const out=outgoing(type);return cart.map(l=>{

 let id=l.productId;if(l.isNew){const np={id:uid('P'),name:l.name,code:l.code||'',cat:'',qty:0,min:5,buy:l.price,sell:l.sell};db.products.push(np);id=np.id}
 const p=db.products.find(x=>x.id===id);let cost=l.cost;
 if(p){p.qty+=out?-l.qty:l.qty;if(type==='purchase')p.buy=l.price;if(cost===undefined)cost=p.buy}
 const o={productId:id,name:l.name,qty:l.qty,price:l.price};if(type==='sales'||type==='return')o.cost=cost||0;return o})}

function reverseDoc(x){
 const sign=outgoing(x.type)?1:-1;
 for(const it of x.items){const p=db.products.find(q=>q.id===it.productId);if(p&&sign<0&&p.qty<it.qty){toast('لا يمكن: كمية «'+it.name+'» الحالية أقل من كمية الفاتورة');return false}}
 x.items.forEach(it=>{const p=db.products.find(q=>q.id===it.productId);if(p)p.qty+=sign*it.qty});
 db.payments.filter(p=>p.ref===x.id).forEach(p=>{const inv=db.invoices.find(i=>i.id===p.invoiceId);if(inv)inv.paid=r2((inv.paid||0)-p.amount)});
 db.payments=db.payments.filter(p=>p.ref!==x.id&&p.invoiceId!==x.id);
 db.invoices=db.invoices.filter(i=>i.id!==x.id);db.returns=db.returns.filter(i=>i.id!==x.id);db.purchaseReturns=db.purchaseReturns.filter(i=>i.id!==x.id);

 return true}

function inRange(d,from,to){const k=ymd(new Date(d));if(from)if(from.length>10?d<from:k<from)return false;if(to)if(to.length>10?d>to:k>to)return false;return true}
function itemCost(i){if(i.labor)return 0;if(i.cost!==undefined)return i.cost;const p=db.products.find(x=>x.id===i.productId);return p?p.buy:0}
function calcStats(from,to){
 const S=db.invoices.filter(x=>x.type==='sales'&&!x.opening&&inRange(x.date,from,to)),P=db.invoices.filter(x=>x.type==='purchase'&&!x.opening&&inRange(x.date,from,to)),R=db.returns.filter(x=>inRange(x.date,from,to)),PR=db.purchaseReturns.filter(x=>inRange(x.date,from,to));
 const sum=a=>r2(a.reduce((s,x)=>s+x.total,0)),cogs=a=>r2(a.reduce((s,x)=>s+x.items.reduce((t,i)=>t+i.qty*itemCost(i),0),0));
 const sales=r2(sum(S)-sum(R)),purch=r2(sum(P)-sum(PR)),c=r2(cogs(S)-cogs(R)),gross=r2(sales-c);
 const exp=r2(db.expenses.filter(e=>e.kind!=='in'&&e.cat!=='سحب شخصي'&&inRange(e.date,from,to)).reduce((a,e)=>a+e.amount,0));
 const by={};const add=(doc,sign)=>{const sub=docSubtotal(doc),f=sub>0?doc.total/sub:1;doc.items.forEach(i=>{const k=i.name,o=by[k]=by[k]||{name:k,qty:0,rev:0,profit:0};const rev=i.qty*i.price*f;o.qty+=sign*i.qty;o.rev+=sign*rev;o.profit+=sign*(rev-i.qty*itemCost(i))})};
 S.forEach(d=>add(d,1));R.forEach(d=>add(d,-1));
 return{sales,purch,cogs:c,gross,exp,net:r2(gross-exp),returns:sum(R),purchReturns:sum(PR),count:S.length,top:Object.values(by).sort((a,b)=>b.profit-a.profit)}}
